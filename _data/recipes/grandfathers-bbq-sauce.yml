title: "Grandfather's Barbecue Sauce"
slug: grandfathers-bbq-sauce
attribution: "Grandfather's recipe"
tags: [sauce, bbq, family]
image: /assets/images/recipes/grandfathers-bbq-sauce-original.jpg
image_alt: "Handwritten recipe card for Grandfather's BBQ Sauce"
image_caption: "The original handwritten recipe."
notes: >
  A slow-simmered barbecue sauce built on Colonel's vinegar, beer, and sherry.
  Never let it boil — patience is the whole technique. Thickened with arrowroot.
  May add a little horseradish if you like heat.

ingredients:
  - "1 qt Colonel's Vinegar"
  - "1 – 16 oz beer"
  - "4 cups sherry"
  - "2 tbsp sugar"
  - "Some honey"
  - "Salt to taste"
  - "4 lemons, cut in 3 pieces"
  - "1 orange, cut in 3 pieces"
  - "4 cloves garlic (or garlic powder)"
  - "2 tbsp chopped onion"
  - "¼ tsp oregano"
  - "1 tbsp dry mustard"
  - "Red and black pepper to taste"
  - "Arrowroot (for thickening)"
  - "Horseradish, optional — a little"

instructions:
  - step: 1
    text: >
      Combine vinegar, beer, sherry, sugar, honey, and salt in a large pot.
  - step: 2
    text: >
      Add the lemons and orange (cut in pieces), garlic, chopped onion,
      oregano, dry mustard, and red and black pepper to taste.
  - step: 3
    text: >
      Simmer in a large pot — never let it boil. Adjust salt and pepper as you go.
  - step: 4
    text: >
      Thicken with arrowroot. (Alternatively, you can brown some corn meal and
      corn starch in a frying pan and use in place of arrowroot.)
  - step: 5
    text: >
      Optional: add a little horseradish for heat.
  - step: 6
    text: >
      If too strong with vinegar, add water to taste.
