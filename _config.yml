title: Jaxlee
tagline: "Discovering the extraordinary within the ordinary—daily routines, adventures, motherhood, creativity, exercise, software development, family, and acts of kindness."
description: >-
  A personal field notebook — photography, software, woodworking, 3D printing,
  sailing, and the occasional long-form piece. Dedicated to appreciating life's
  finer details and celebrating the beauty of everyday moments.
author: Sheehan Commette
email: ""

# Social / off-site links (rendered in footer)
social:
  - name: Flickr
    url: "https://www.flickr.com/people/127544400@N03/"
  - name: Instagram
    url: "https://www.instagram.com/jaxleedigital/"
  - name: Instagram (Neka)
    url: "https://www.instagram.com/neka_pup/"
  - name: Adafruit Playground
    url: "https://adafruit-playground.com/u/Sheehan/pages"
# Keep the old top-level key for backward compat
flickr: "https://www.flickr.com/people/127544400@N03/"
baseurl: "/jaxlee"      # project-page subpath; set to "" if a custom domain is attached
url: "https://jaxlee-digital.github.io"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:slug/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

paginate: 10
paginate_path: "/blog/page:num/"

# Collections
collections:
  photography:
    output: true
    permalink: /photography/:slug/
  software:
    output: true
    permalink: /software/:slug/
  woodworking:
    output: true
    permalink: /woodworking/:slug/
  3dprinting:
    output: true
    permalink: /3d/:slug/

defaults:
  - scope: { path: "", type: "posts" }
    values: { layout: "post" }
  - scope: { path: "", type: "photography" }
    values: { layout: "item", section: "photography" }
  - scope: { path: "", type: "software" }
    values: { layout: "item", section: "software" }
  - scope: { path: "", type: "woodworking" }
    values: { layout: "item", section: "woodworking" }
  - scope: { path: "", type: "3dprinting" }
    values: { layout: "item", section: "3dprinting" }

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .jekyll-cache/
