title: jaxlee digital
tagline: "A field notebook."
description: >-
  A field notebook. Photography, software, craft, writing, and whatever
  else catches my attention.
author: Sheehan Commette
email: ""

# Social / off-site links (rendered in footer)
social:
  - name: Flickr
    url: "https://www.flickr.com/people/127544400@N03/"
    icon: "fa-brands fa-flickr"
  - name: Instagram
    url: "https://www.instagram.com/jaxleedigital/"
    icon: "fa-brands fa-instagram"
  - name: Instagram (Neka)
    url: "https://www.instagram.com/neka_pup/"
    icon_img: "/assets/images/icons/neka.png"
  - name: Adafruit Playground
    url: "https://adafruit-playground.com/u/Sheehan/pages"
    icon_img: "/assets/images/icons/adafruit.ico"
# Keep the old top-level key for backward compat
flickr: "https://www.flickr.com/people/127544400@N03/"
baseurl: "/jaxlee"      # project-page subpath; set to "" if a custom domain is attached
url: "https://jaxlee-digital.github.io"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /field-notes/:year/:month/:slug/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

paginate: 10
paginate_path: "/field-notes/page:num/"

# Collections
collections:
  resumes:
    output: true
    permalink: /resumes/:slug/
  log:
    output: true
    permalink: /log/:slug/

defaults:
  - scope: { path: "", type: "posts" }
    values: { layout: "post", author: "sheehan" }
  - scope: { path: "", type: "resumes" }
    values: { layout: "item", section: "resumes" }
  - scope: { path: "", type: "log" }
    values: { layout: "log-entry", section: "log" }

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .jekyll-cache/
