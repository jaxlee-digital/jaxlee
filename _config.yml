title: jaxlee digital
tagline: "A field notebook."
description: >-
  A field notebook. Photography, software, craft, writing, and whatever
  else catches my attention.
author: Sheehan Commette
email: ""

# Social / off-site links (rendered in footer)
social:
  - name: Flickr
    url: "https://www.flickr.com/people/127544400@N03/"
  - name: Instagram
    url: "https://www.instagram.com/jaxleedigital/"
  - name: Instagram (Neka)
    url: "https://www.instagram.com/neka_pup/"
  - name: Adafruit Playground
    url: "https://adafruit-playground.com/u/Sheehan/pages"
# Keep the old top-level key for backward compat
flickr: "https://www.flickr.com/people/127544400@N03/"
baseurl: "/jaxlee"      # project-page subpath; set to "" if a custom domain is attached
url: "https://jaxlee-digital.github.io"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /writing/:year/:month/:slug/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

paginate: 10
paginate_path: "/writing/page:num/"

# Collections
collections:
  photography:
    output: true
    permalink: /photography/:slug/
  software:
    output: true
    permalink: /software/:slug/
  craft:
    output: true
    permalink: /craft/:slug/
  resumes:
    output: true
    permalink: /resumes/:slug/

defaults:
  - scope: { path: "", type: "posts" }
    values: { layout: "post" }
  - scope: { path: "", type: "photography" }
    values: { layout: "item", section: "photography" }
  - scope: { path: "", type: "software" }
    values: { layout: "item", section: "software" }
  - scope: { path: "", type: "craft" }
    values: { layout: "item", section: "craft" }
  - scope: { path: "", type: "resumes" }
    values: { layout: "item", section: "resumes" }

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .jekyll-cache/
