---
layout: default
---
<article class="appslet">
  <header class="appslet__header">
    <p class="appslet__eyebrow"><a href="{{ '/apps/' | relative_url }}">← Apps</a></p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}
    <p class="appslet__description">{{ page.description }}</p>
    {% endif %}
  </header>

  <div class="appslet__body">
    {{ content }}
  </div>
</article>
