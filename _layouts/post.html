---
layout: default
---
<article class="post">
  <header class="post__header">
    <h1>{{ page.title }}</h1>
    {% include byline.html %}
  </header>

  {% if page.hero %}
  <figure class="post__hero">
    <img src="{{ page.hero | relative_url }}"
         alt="{{ page.hero_alt | default: page.title | escape }}">
    {% if page.hero_caption %}
    <figcaption>{{ page.hero_caption }}</figcaption>
    {% endif %}
  </figure>
  {% endif %}

  <div class="post__body">
    {{ content }}
  </div>

  {% if page.tags and page.tags.size > 0 %}
  <footer class="post__footer">
    <p class="tag-list">
      {% for tag in page.tags %}
        <a class="tag" href="{{ '/tag/' | append: tag | append: '/' | relative_url }}">#{{ tag }}</a>
      {% endfor %}
    </p>
  </footer>
  {% endif %}
</article>
