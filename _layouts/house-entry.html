---
layout: default
---
<article class="house-entry">
  <header class="house-entry__header">
    <p class="house-entry__section"><a href="{{ '/house/' | relative_url }}">House</a></p>
    <h1>{{ page.title }}</h1>
    {% if page.date %}<p class="house-entry__meta"><time>{{ page.date | date: "%b %Y" }}</time></p>{% endif %}
  </header>

  <div class="house-entry__body">
    {{ content }}
  </div>

  {% if page.before and page.after %}
    <section class="house-entry__ba">
      <figure>
        <img src="{{ page.before | relative_url }}" alt="Before" loading="lazy">
        <figcaption>Before</figcaption>
      </figure>
      <figure>
        <img src="{{ page.after | relative_url }}" alt="After" loading="lazy">
        <figcaption>After</figcaption>
      </figure>
    </section>
  {% endif %}

  {% if page.gallery %}
    <section class="house-entry__gallery">
      {% for img in page.gallery %}
        <figure>
          <img src="{{ img.src | relative_url }}" alt="{{ img.alt | default: '' }}" loading="lazy">
          {% if img.caption %}<figcaption>{{ img.caption }}</figcaption>{% endif %}
        </figure>
      {% endfor %}
    </section>
  {% endif %}
</article>
